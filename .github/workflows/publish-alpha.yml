name: Publish Beta Packages

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-staging
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish-beta:
    name: Validate and publish beta packages
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      source_sha: ${{ github.sha }}
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Select immutable beta version
        id: version
        shell: pwsh
        run: |
          $version = "0.1.0-beta.${{ github.run_number }}"
          "PACKAGE_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
          "package_version=$version" >> $env:GITHUB_OUTPUT
          "### Nodal Framework $version" | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      - name: Run complete QA and verify packages
        shell: pwsh
        run: ./eng/verify.ps1 -PackageVersion $env:PACKAGE_VERSION

      - name: Audit NuGet dependencies and attach release evidence
        shell: pwsh
        run: ./eng/verify-dependencies.ps1 -OutputFile 'TestResults/release-evidence/dependency-audit.json'

      - name: Generate SPDX SBOM
        shell: pwsh
        run: ./eng/generate-sbom.ps1 -PackageVersion $env:PACKAGE_VERSION

      - name: Generate release evidence and capability report
        shell: pwsh
        run: |
          ./eng/generate-release-evidence.ps1 `
            -PackageVersion $env:PACKAGE_VERSION `
            -CommitSha '${{ github.sha }}'

      - name: Upload verified package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nodal-${{ env.PACKAGE_VERSION }}
          path: |
            TestResults/package-verification/*.nupkg
            TestResults/package-verification/*.snupkg
            TestResults/release-evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: Attest package build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            TestResults/package-verification/*.nupkg
            TestResults/package-verification/*.snupkg

      - name: Validate NuGet publishing identity
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw "The staging environment must define the NUGET_USER variable."
          }

      - name: Sign in to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish beta packages to NuGet
        shell: pwsh
        env:
          TEMPORARY_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packageDirectory = './TestResults/package-verification'
          $packageIds = @(
            'Nodal.Core',
            'Nodal.Migrations',
            'Nodal.Neo4j',
            'Nodal.Analytics',
            'Nodal.TigerGraph',
            'Nodal.Tool',
            'Nodal.Import',
            'Nodal.Import.Csv',
            'Nodal.Import.Relational'
          )

          foreach ($packageId in $packageIds) {
            $packagePath = Join-Path `
              $packageDirectory `
              "$packageId.$env:PACKAGE_VERSION.nupkg"
            if (-not (Test-Path -LiteralPath $packagePath)) {
              throw "Verified package '$packagePath' was not found."
            }

            dotnet nuget push $packagePath `
              --api-key $env:TEMPORARY_NUGET_API_KEY `
              --source $env:NUGET_SOURCE
            if ($LASTEXITCODE -ne 0) {
              throw "Publishing '$packageId' failed with exit code $LASTEXITCODE."
            }
          }

          "Published all public packages to NuGet.org." | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

  published-consumer-smoke:
    name: Validate published package consumer
    needs: publish-beta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore and run the World Food Delivery consumer
        shell: pwsh
        run: ./eng/run-published-consumer-smoke.ps1 -PackageVersion '${{ needs.publish-beta.outputs.package_version }}'

      - name: Upload consumer verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-consumer-smoke-${{ needs.publish-beta.outputs.package_version }}
          path: TestResults/published-consumer-smoke.json
          if-no-files-found: error
          retention-days: 30

  release-record:
    name: Create immutable beta release record
    needs: [publish-beta, published-consumer-smoke]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*${{ needs.publish-beta.outputs.package_version }}*'
          path: release-artifacts
          merge-multiple: true

      - name: Create or verify immutable prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.publish-beta.outputs.package_version }}
          SOURCE_SHA: ${{ needs.publish-beta.outputs.source_sha }}
        run: |
          $tag = "v$env:PACKAGE_VERSION"
          $repository = '${{ github.repository }}'
          $assets = @(Get-ChildItem -LiteralPath 'release-artifacts' -File -Recurse |
            ForEach-Object FullName)
          if ($assets.Count -lt 22) {
            throw "Expected package, SBOM, audit, reproducibility, and consumer evidence; found $($assets.Count) files."
          }
          $existing = gh release view $tag --repo $repository --json targetCommitish,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if ($release.targetCommitish -ne $env:SOURCE_SHA) {
              throw "Release '$tag' already targets '$($release.targetCommitish)', not '$env:SOURCE_SHA'."
            }
            Write-Host "Verified existing immutable release $($release.url)."
          }
          else {
            gh release create $tag `
              --repo $repository `
              --target $env:SOURCE_SHA `
              --title "Nodal Framework $env:PACKAGE_VERSION" `
              --notes "Automated beta release from protected staging commit $env:SOURCE_SHA. Package hashes, SBOM, dependency audit, provenance, and clean-room evidence are attached." `
              --prerelease `
              $assets
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub prerelease '$tag' could not be created."
            }
          }
