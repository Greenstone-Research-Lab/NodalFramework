name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'docs/api/**'
      - 'src/**'
      - 'eng/build-docs.ps1'
      - '.config/dotnet-tools.json'
      - '.github/workflows/deploy-documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodal-docs-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    name: Publish Cloudflare Pages site
    if: github.event_name == 'workflow_dispatch' || vars.NODAL_DOCS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: documentation-production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build static site
        shell: pwsh
        run: ./eng/build-docs.ps1

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.125.0 pages deploy website/build --project-name nodalframework --branch master
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
