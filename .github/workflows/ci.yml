name: Nodal CI

on:
  push:
    branches: [developer, staging, master]
  pull_request:
    branches: [developer, staging, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  quality:
    name: Format, build, test, coverage, packages
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify specification repository
        shell: pwsh
        run: ./eng/verify-specifications.ps1

      - name: Verify pull request specification reference
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        shell: pwsh
        env:
          NODAL_PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: ./eng/verify-pr-specification.ps1 -PullRequestBody $env:NODAL_PULL_REQUEST_BODY

      - name: Restore
        run: dotnet restore Nodal.slnx

      - name: Verify formatting
        run: dotnet format Nodal.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Nodal.slnx --configuration Release --no-restore

      - name: Run test suite
        run: dotnet test Nodal.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Enforce architecture rules with debug artifacts
        run: >-
          dotnet test tests/Nodal.ArchitectureTests/Nodal.ArchitectureTests.csproj
          --configuration Debug
          --no-restore
          --filter FullyQualifiedName~ProductArchitectureRules
          --logger "console;verbosity=normal"

      - name: Enforce provider contracts
        run: >-
          dotnet test tests/Nodal.ProviderContractTests/Nodal.ProviderContractTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "console;verbosity=normal"

      - name: Enforce product coverage
        shell: pwsh
        run: ./eng/verify-coverage.ps1

      - name: Verify NuGet packages
        shell: pwsh
        run: ./eng/verify-packages.ps1

      - name: Verify reproducible NuGet packages
        shell: pwsh
        run: ./eng/verify-reproducible-packages.ps1

      - name: Verify documentation and package contract
        shell: pwsh
        run: ./eng/verify-documentation-contract.ps1

      - name: Verify clean-room consumer against package artifacts
        shell: pwsh
        run: |
          ./eng/run-published-consumer-smoke.ps1 `
            -PackageVersion '0.1.0-beta.1' `
            -PackageSource "$PWD/TestResults/package-verification" `
            -AdditionalPackageSource 'https://api.nuget.org/v3/index.json'

      - name: Audit NuGet dependencies
        shell: pwsh
        run: ./eng/verify-dependencies.ps1

      - name: Upload beta-closure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-closure-${{ github.sha }}
          path: |
            TestResults/dependency-audit.json
            TestResults/published-consumer-smoke.json
            TestResults/reproducible-packages/reproducibility.json
          if-no-files-found: error
          retention-days: 14

  neo4j-smoke:
    name: Neo4j live smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Run disposable Neo4j integration tests
        shell: pwsh
        run: ./eng/run-neo4j-integration.ps1

  tigergraph-smoke:
    name: TigerGraph live smoke
    if: github.event_name != 'pull_request' && vars.NODAL_RUN_TIGERGRAPH == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tigergraph-qa
    env:
      NODAL_TIGERGRAPH_ENDPOINT: ${{ secrets.NODAL_TIGERGRAPH_ENDPOINT }}
      NODAL_TIGERGRAPH_ACCESS_TOKEN: ${{ secrets.NODAL_TIGERGRAPH_ACCESS_TOKEN }}
      NODAL_TIGERGRAPH_GRAPH: ${{ secrets.NODAL_TIGERGRAPH_GRAPH }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Run TigerGraph QA integration tests
        shell: pwsh
        run: ./eng/run-tigergraph-integration.ps1
