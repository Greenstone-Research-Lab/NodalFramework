version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /website
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Istanbul
    groups:
      documentation-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Istanbul

  - package-ecosystem: github-actions
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Istanbul
