name: nodal-local

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: nodal-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/NodalLocal123!
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - nodal-neo4j-data:/data

  tigergraph:
    image: tigergraph/community:4.2.4
    container_name: nodal-tigergraph
    profiles: ["tigergraph"]
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:14240:14240"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:14240/api/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    volumes:
      - nodal-tigergraph-data:/home/tigergraph
      - ./infra/tigergraph:/home/tigergraph/nodal-init:ro

volumes:
  nodal-neo4j-data:
  nodal-tigergraph-data:
